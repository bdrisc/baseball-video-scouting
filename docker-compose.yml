name: baseball-video-scouting

services:
  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-baseball_video_scouting}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  data-loader:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: baseball-video-scouting-backend:local
    environment:
      PGPASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}"
      POSTGRES_DB: ${POSTGRES_DB:-baseball_video_scouting}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      CLEANED_DATASET: ${CLEANED_DATASET:-Messick_cleaned.csv}
    volumes:
      - ./data/processed:/data/processed:ro
    depends_on:
      database:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        dataset="/data/processed/$${CLEANED_DATASET}"
        if [ -f "$${dataset}" ]; then
          python scripts/load_database.py \
            --csv "$${dataset}" \
            --host database \
            --port 5432 \
            --database "$${POSTGRES_DB:-baseball_video_scouting}" \
            --user "$${POSTGRES_USER:-postgres}"
        else
          echo "No cleaned dataset found at $${dataset}; starting with an empty database."
        fi
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: baseball-video-scouting-backend:local
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-baseball_video_scouting}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}
      FRONTEND_ORIGINS: http://localhost:${FRONTEND_PORT:-5173},http://127.0.0.1:${FRONTEND_PORT:-5173}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      data-loader:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    init: true
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api
    image: baseball-video-scouting-frontend:local
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - http://127.0.0.1/
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
