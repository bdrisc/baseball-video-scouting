name: Continuous Integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-quality:
    name: Python formatting, linting, and tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: baseball_video_scouting_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d baseball_video_scouting_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/baseball_video_scouting_test
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: baseball_video_scouting_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: baseball_video_scouting_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            scripts/requirements.txt
            requirements-dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Initialize test database
        env:
          PGPASSWORD: postgres
        run: |
          psql \
            --host=127.0.0.1 \
            --username=postgres \
            --dbname=baseball_video_scouting_test \
            --file=database/schema.sql

      - name: Check Python formatting
        run: python -m ruff format --check backend scripts

      - name: Lint Python
        run: python -m ruff check backend scripts

      - name: Run Python tests
        run: python -m pytest -q

  frontend-quality:
    name: React linting, tests, and production build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install JavaScript dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint React application
        working-directory: frontend
        run: npm run lint --if-present

      - name: Run React tests
        working-directory: frontend
        run: npm run test -- --run

      - name: Build React application
        working-directory: frontend
        run: npm run build